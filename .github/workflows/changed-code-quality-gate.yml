---
name: changed-code-quality-gate

"on":
  push:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changed-code-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request base policy
        if: github.event_name == 'pull_request_target'
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: .quality-gate-runner
          persist-credentials: false
      - name: Checkout pre-push policy
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1
          path: .quality-gate-runner
          persist-credentials: false
      - name: Checkout working-trunk policy for new branch
        if: >-
          github.event_name == 'push' &&
          github.event.before == '0000000000000000000000000000000000000000'
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          path: .quality-gate-runner
          persist-credentials: false
      - name: Checkout candidate with history
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: >-
            ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Add immutable upstream base to fork checkout
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          git -C candidate fetch --no-tags
          ../.quality-gate-runner "$BASE_SHA"
      - name: Add working-trunk base to new branch checkout
        if: >-
          github.event_name == 'push' &&
          github.event.before == '0000000000000000000000000000000000000000'
        run: >-
          git -C candidate fetch --no-tags ../.quality-gate-runner
          HEAD:refs/remotes/origin/main
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned analyzer
        run: >-
          python -m pip install --require-hashes
          -r .quality-gate-runner/.github/requirements/semgrep.lock
      - name: Analyze pull-request changes with trusted policy
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python .quality-gate-runner/scripts/changed_code_quality_gate.py
          --repo candidate --policy-root .quality-gate-runner
          --event pull_request --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Analyze push changes with trusted policy
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python .quality-gate-runner/scripts/changed_code_quality_gate.py
          --repo candidate --policy-root .quality-gate-runner
          --event push --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Analyze new branch against trusted working trunk
        if: >-
          github.event_name == 'push' &&
          github.event.before == '0000000000000000000000000000000000000000'
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_BRANCH: main
        run: >-
          python .quality-gate-runner/scripts/changed_code_quality_gate.py
          --repo candidate --policy-root .quality-gate-runner
          --base "origin/$BASE_BRANCH" --head "$HEAD_SHA"
