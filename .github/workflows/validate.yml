---
name: validate

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned scanner releases with their published SHA-256 checksums (bump deliberately).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  SYFT_VERSION: "1.51.1"
  SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
  GRYPE_VERSION: "0.118.0"
  GRYPE_SHA256: "1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip install --upgrade pip
          pip install yamllint semgrep
      - name: Install pinned scanners (checksum verified)
        run: |
          set -euo pipefail
          fetch() { # name version sha256 url
            curl -fsSL -o "/tmp/$1.tar.gz" "$4"
            echo "$3  /tmp/$1.tar.gz" | sha256sum -c -
            sudo tar -xz -C /usr/local/bin -f "/tmp/$1.tar.gz" "$1"
          }
          fetch gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fetch actionlint "$ACTIONLINT_VERSION" "$ACTIONLINT_SHA256" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          fetch syft "$SYFT_VERSION" "$SYFT_SHA256" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          fetch grype "$GRYPE_VERSION" "$GRYPE_SHA256" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          gitleaks version && actionlint -version && syft version && grype version
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Install SkillSpector (best effort)
        continue-on-error: true
        run: pip install skillspector
      - name: Make shell scripts executable
        run: chmod +x scripts/*.sh scripts/templates/*.sh .codex/*.sh INFRA.sh
      - name: Regenerate provider compatibility surfaces
        run: ./scripts/sync-tool-configs.sh . --skip-agents-md --skip-github
      - name: Toolkit index and genericity validation
        run: ./scripts/validate-toolkit-indexes.sh
      - name: Toolkit security check
        run: ./scripts/security-check-toolkit.sh
      - name: SkillSpector full skill scan
        run: ./scripts/validate-skills-with-skillspector.sh --all || test "$?" -eq 127
      - name: Toolkit validation (node validators + unit tests)
        run: SKIP_SECURITY_CHECK_TOOLKIT=1 npm run validate
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
